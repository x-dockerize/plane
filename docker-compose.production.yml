x-redis-env: &redis-env
  REDIS_HOST: ${REDIS_HOST:-plane-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_URL: ${REDIS_URL:-redis://plane-redis:6379/}

x-minio-env: &minio-env
  MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-access-key}
  MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-secret-key}

x-aws-s3-env: &aws-s3-env
  AWS_REGION: ${AWS_REGION:-}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-access-key}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-secret-key}
  AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-http://plane-minio:9000}
  AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}

x-proxy-env: &proxy-env
  APP_DOMAIN: ${APP_DOMAIN:-localhost}
  FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
  CERT_EMAIL: ${CERT_EMAIL}
  CERT_ACME_CA: ${CERT_ACME_CA}
  CERT_ACME_DNS: ${CERT_ACME_DNS}
  LISTEN_HTTP_PORT: ${LISTEN_HTTP_PORT:-80}
  LISTEN_HTTPS_PORT: ${LISTEN_HTTPS_PORT:-443}
  BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
  SITE_ADDRESS: ${SITE_ADDRESS:-:80}

x-mq-env: &mq-env # RabbitMQ Settings
  RABBITMQ_HOST: ${RABBITMQ_HOST:-plane-mq}
  RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
  RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-plane}
  RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-plane}
  RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-plane}
  RABBITMQ_VHOST: ${RABBITMQ_VHOST:-plane}

x-live-env: &live-env
  API_BASE_URL: ${API_BASE_URL:-http://api:8000}
  LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY:-2FiJk1U2aiVPEQtzLehYGlTSnTnrs7LW}

x-app-env: &app-env
  WEB_URL: ${WEB_URL:-http://localhost}
  DEBUG: ${DEBUG:-0}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
  GUNICORN_WORKERS: 1
  USE_MINIO: ${USE_MINIO:-1}
  DATABASE_URL: ${DATABASE_URL:-postgresql://plane:plane@postgres/plane}
  SECRET_KEY: ${SECRET_KEY:-60gp0byfz2dvffa45cxl20p1scy9xbpf6d8c5y0geejgkyp1b5}
  AMQP_URL: ${AMQP_URL:-amqp://plane:plane@plane-mq:5672/plane}
  API_KEY_RATE_LIMIT: ${API_KEY_RATE_LIMIT:-60/minute}
  MINIO_ENDPOINT_SSL: ${MINIO_ENDPOINT_SSL:-0}
  LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY:-2FiJk1U2aiVPEQtzLehYGlTSnTnrs7LW}

services:
  web:
    image: artifacts.plane.so/makeplane/plane-frontend:${APP_RELEASE:-v1.2.1}
    container_name: plane-web
    env_file: .env
    networks:
      - traefik-network
      - internal-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-network

      - traefik.http.routers.plane-web.rule=Host(`board.aqtivite.com.tr`)
      - traefik.http.routers.plane-web.entrypoints=websecure
      - traefik.http.routers.plane-web.tls.certresolver=le-cloudflare
      - traefik.http.routers.plane-web.service=plane-web

      - traefik.http.services.plane-web.loadbalancer.server.port=3000
    deploy:
      replicas: ${WEB_REPLICAS:-1}
      restart_policy:
        condition: any
    depends_on:
      - api
      - worker

  space:
    image: artifacts.plane.so/makeplane/plane-space:${APP_RELEASE:-v1.2.1}
    container_name: plane-space
    env_file: .env
    networks:
      - traefik-network
      - internal-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-network

      - traefik.http.routers.plane-space.rule=Host(`space.board.aqtivite.com.tr`)
      - traefik.http.routers.plane-space.entrypoints=websecure
      - traefik.http.routers.plane-space.tls.certresolver=le-cloudflare
      - traefik.http.routers.plane-space.service=plane-space

      - traefik.http.services.plane-space.loadbalancer.server.port=3000
    deploy:
      replicas: ${SPACE_REPLICAS:-1}
      restart_policy:
        condition: any
    depends_on:
      - api
      - worker
      - web

  admin:
    image: artifacts.plane.so/makeplane/plane-admin:${APP_RELEASE:-v1.2.1}
    container_name: plane-admin
    env_file: .env
    networks:
      - traefik-network
      - internal-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-network

      - traefik.http.routers.plane-admin.rule=Host(`admin.board.aqtivite.com.tr`)
      - traefik.http.routers.plane-admin.entrypoints=websecure
      - traefik.http.routers.plane-admin.tls.certresolver=le-cloudflare
      - traefik.http.routers.plane-admin.service=plane-admin

      - traefik.http.services.plane-admin.loadbalancer.server.port=3000
    deploy:
      replicas: ${ADMIN_REPLICAS:-1}
      restart_policy:
        condition: any
    depends_on:
      - api
      - web

  live:
    image: artifacts.plane.so/makeplane/plane-live:${APP_RELEASE:-v1.2.1}
    container_name: plane-live
    env_file: .env
    networks:
      - traefik-network
      - internal-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-network

      - traefik.http.routers.plane-live.rule=Host(`live.board.aqtivite.com.tr`)
      - traefik.http.routers.plane-live.entrypoints=websecure
      - traefik.http.routers.plane-live.tls.certresolver=le-cloudflare
      - traefik.http.routers.plane-live.service=plane-live

      - traefik.http.services.plane-live.loadbalancer.server.port=3000
    environment:
      <<: [*live-env, *redis-env]
    deploy:
      replicas: ${LIVE_REPLICAS:-1}
      restart_policy:
        condition: any
    depends_on:
      - api
      - web

  api:
    image: artifacts.plane.so/makeplane/plane-backend:${APP_RELEASE:-v1.2.1}
    container_name: plane-api
    env_file: .env
    command: ./bin/docker-entrypoint-api.sh
    networks:
      - traefik-network
      - postgres-network
      - internal-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-network

      - traefik.http.routers.plane-api-samehost.rule=Host(`board.aqtivite.com.tr`) && (PathPrefix(`/api`) || PathPrefix(`/auth`) || PathPrefix(`/users`) || PathPrefix(`/workspaces`))
      - traefik.http.routers.plane-api-samehost.entrypoints=websecure
      - traefik.http.routers.plane-api-samehost.tls.certresolver=le-cloudflare
      - traefik.http.routers.plane-api-samehost.service=plane-api

      - traefik.http.services.plane-api.loadbalancer.server.port=8000
    deploy:
      replicas: ${API_REPLICAS:-1}
      restart_policy:
        condition: any
    volumes:
      - logs_api:/code/plane/logs
    environment:
      <<: [*app-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env]
    depends_on:
      - redis
      - mq

  worker:
    image: artifacts.plane.so/makeplane/plane-backend:${APP_RELEASE:-v1.2.1}
    container_name: plane-worker
    env_file: .env
    command: ./bin/docker-entrypoint-worker.sh
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
      restart_policy:
        condition: any
    volumes:
      - logs_worker:/code/plane/logs
    environment:
      <<: [*app-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env]
    networks:
      - postgres-network
      - internal-network
    depends_on:
      - api
      - redis
      - mq

  beat-worker:
    image: artifacts.plane.so/makeplane/plane-backend:${APP_RELEASE:-v1.2.1}
    container_name: plane-beat-worker
    env_file: .env
    command: ./bin/docker-entrypoint-beat.sh
    deploy:
      replicas: ${BEAT_WORKER_REPLICAS:-1}
      restart_policy:
        condition: any
    volumes:
      - logs_beat-worker:/code/plane/logs
    environment:
      <<: [*app-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env]
    networks:
      - postgres-network
      - internal-network
    depends_on:
      - api
      - redis
      - mq

  migrator:
    image: artifacts.plane.so/makeplane/plane-backend:${APP_RELEASE:-v1.2.1}
    container_name: plane-migrator
    env_file: .env
    command: ./bin/docker-entrypoint-migrator.sh
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    volumes:
      - logs_migrator:/code/plane/logs
    environment:
      <<: [*app-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env]
    networks:
      postgres-network:
    depends_on:
      - redis

  redis:
    image: valkey/valkey:7.2.11-alpine
    container_name: plane-redis
    env_file: .env
    networks:
      - internal-network
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    volumes:
      - redisdata:/data

  mq:
    image: rabbitmq:3.13.6-management-alpine
    container_name: plane-mq
    env_file: .env
    networks:
      - internal-network
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    environment:
      <<: *mq-env
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  # Comment this if you using any external s3 compatible storage
  minio:
    image: minio/minio:latest
    container_name: plane-minio
    env_file: .env
    command: server /export --console-address ":9090"
    networks:
      - internal-network
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    environment:
      <<: *minio-env
    volumes:
      - uploads:/export

volumes:
  redisdata:
  uploads:
  logs_api:
  logs_worker:
  logs_beat-worker:
  logs_migrator:
  rabbitmq_data:


networks:
  internal-network:
  traefik-network:
    external: true
  postgres-network:
    external: true
