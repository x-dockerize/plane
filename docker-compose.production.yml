x-redis-env: &redis-env
  REDIS_HOST: ${REDIS_HOST:-plane-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_URL: ${REDIS_URL:-redis://plane-redis:6379/}

x-minio-env: &minio-env
  MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-access-key}
  MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-secret-key}

x-aws-s3-env: &aws-s3-env
  AWS_REGION: ${AWS_REGION:-}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-access-key}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-secret-key}
  AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-http://plane-minio:9000}
  AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}

x-mq-env: &mq-env # RabbitMQ Settings
  RABBITMQ_HOST: ${RABBITMQ_HOST:-plane-mq}
  RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
  RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-plane}
  RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-plane}
  RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-plane}
  RABBITMQ_VHOST: ${RABBITMQ_VHOST:-plane}

x-live-env: &live-env
  API_BASE_URL: ${API_BASE_URL:-http://api:8000}
  LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY}

x-app-env: &app-env
  WEB_URL: ${WEB_URL:-http://localhost}
  DEBUG: ${DEBUG:-0}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
  GUNICORN_WORKERS: 1
  USE_MINIO: ${USE_MINIO:-1}
  DATABASE_URL: ${DATABASE_URL:-postgresql://plane:${POSTGRES_PASSWORD}@postgres/plane}
  SECRET_KEY: ${SECRET_KEY}
  AMQP_URL: ${AMQP_URL:-amqp://${RABBITMQ_USER:-plane}:${RABBITMQ_PASSWORD:-plane}@${RABBITMQ_HOST:-plane-mq}:${RABBITMQ_PORT:-5672}/${RABBITMQ_VHOST:-plane}}
  API_KEY_RATE_LIMIT: ${API_KEY_RATE_LIMIT:-60/minute}
  MINIO_ENDPOINT_SSL: ${MINIO_ENDPOINT_SSL:-0}
  LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY}

services:
  web:
    image: artifacts.plane.so/makeplane/plane-frontend:${APP_RELEASE:?required}
    container_name: plane-web
    deploy:
      replicas: ${WEB_REPLICAS:-1}
      restart_policy:
        condition: any
    depends_on:
      - api
      - worker
    env_file: .env
    networks:
      - internal-network
      - traefik-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-network

      - traefik.http.routers.plane-web.rule=Host(`${PLANE_SERVER_HOSTNAME:?required}`)
      - traefik.http.routers.plane-web.entrypoints=websecure
      - traefik.http.routers.plane-web.tls.certresolver=le-cloudflare
      - traefik.http.routers.plane-web.service=plane-web

      - traefik.http.services.plane-web.loadbalancer.server.port=3000

  space:
    image: artifacts.plane.so/makeplane/plane-space:${APP_RELEASE:?required}
    container_name: plane-space
    deploy:
      replicas: ${SPACE_REPLICAS:-1}
      restart_policy:
        condition: any
    depends_on:
      - api
      - worker
      - web
    env_file: .env
    networks:
      - internal-network
      - traefik-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-network

      - traefik.http.routers.plane-space.rule=Host(`${PLANE_SERVER_HOSTNAME:?required}`) && PathPrefix(`/spaces`)
      - traefik.http.routers.plane-space.entrypoints=websecure
      - traefik.http.routers.plane-space.tls.certresolver=le-cloudflare
      - traefik.http.routers.plane-space.service=plane-space

      - traefik.http.services.plane-space.loadbalancer.server.port=3000

  admin:
    image: artifacts.plane.so/makeplane/plane-admin:${APP_RELEASE:?required}
    container_name: plane-admin
    deploy:
      replicas: ${ADMIN_REPLICAS:-1}
      restart_policy:
        condition: any
    depends_on:
      - api
      - web
    env_file: .env
    networks:
      - internal-network
      - traefik-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-network

      - traefik.http.routers.plane-admin.rule=Host(`${PLANE_SERVER_HOSTNAME:?required}`) && PathPrefix(`/god-mode`)
      - traefik.http.routers.plane-admin.entrypoints=websecure
      - traefik.http.routers.plane-admin.tls.certresolver=le-cloudflare
      - traefik.http.routers.plane-admin.middlewares=trusted@file
      - traefik.http.routers.plane-admin.service=plane-admin

      - traefik.http.services.plane-admin.loadbalancer.server.port=3000

  live:
    image: artifacts.plane.so/makeplane/plane-live:${APP_RELEASE:?required}
    container_name: plane-live
    deploy:
      replicas: ${LIVE_REPLICAS:-1}
      restart_policy:
        condition: any
    depends_on:
      - api
      - web
    env_file: .env
    environment:
      <<: [*live-env, *redis-env]
    networks:
      - internal-network
      - traefik-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-network

      - traefik.http.routers.plane-live.rule=Host(`${PLANE_SERVER_HOSTNAME:?required}`) && PathPrefix(`/live`)
      - traefik.http.routers.plane-live.entrypoints=websecure
      - traefik.http.routers.plane-live.tls.certresolver=le-cloudflare
      - traefik.http.routers.plane-live.service=plane-live

      - traefik.http.services.plane-live.loadbalancer.server.port=3000

  api:
    image: artifacts.plane.so/makeplane/plane-backend:${APP_RELEASE:?required}
    container_name: plane-api
    command: ./bin/docker-entrypoint-api.sh
    deploy:
      replicas: ${API_REPLICAS:-1}
      restart_policy:
        condition: any
    depends_on:
      - redis
      - mq
    env_file: .env
    environment:
      <<: [*app-env, *redis-env, *minio-env, *aws-s3-env]
    volumes:
      - logs_api:/code/plane/logs
    networks:
      - internal-network
      - traefik-network
      - postgres-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-network

      - traefik.http.routers.plane-api.rule=Host(`${PLANE_SERVER_HOSTNAME:?required}`) && (PathPrefix(`/api`) || PathPrefix(`/auth`) || PathPrefix(`/m/auth`))
      - traefik.http.routers.plane-api.entrypoints=websecure
      - traefik.http.routers.plane-api.tls.certresolver=le-cloudflare
      - traefik.http.routers.plane-api.service=plane-api

      - traefik.http.services.plane-api.loadbalancer.server.port=8000

  worker:
    image: artifacts.plane.so/makeplane/plane-backend:${APP_RELEASE:?required}
    container_name: plane-worker
    command: ./bin/docker-entrypoint-worker.sh
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
      restart_policy:
        condition: any
    depends_on:
      - api
      - redis
      - mq
    env_file: .env
    environment:
      <<: [*app-env, *redis-env, *minio-env, *aws-s3-env]
    volumes:
      - logs_worker:/code/plane/logs
    networks:
      - internal-network
      - postgres-network

  beat-worker:
    image: artifacts.plane.so/makeplane/plane-backend:${APP_RELEASE:?required}
    container_name: plane-beat-worker
    command: ./bin/docker-entrypoint-beat.sh
    deploy:
      replicas: ${BEAT_WORKER_REPLICAS:-1}
      restart_policy:
        condition: any
    depends_on:
      - api
      - redis
      - mq
    env_file: .env
    environment:
      <<: [*app-env, *redis-env, *minio-env, *aws-s3-env]
    volumes:
      - logs_beat-worker:/code/plane/logs
    networks:
      - internal-network
      - postgres-network

  migrator:
    image: artifacts.plane.so/makeplane/plane-backend:${APP_RELEASE:?required}
    container_name: plane-migrator
    command: ./bin/docker-entrypoint-migrator.sh
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    depends_on:
      - redis
    env_file: .env
    environment:
      <<: [*app-env, *redis-env, *minio-env, *aws-s3-env]
    volumes:
      - logs_migrator:/code/plane/logs
    networks:
      - internal-network
      - postgres-network

  redis:
    image: valkey/valkey:7.2.11-alpine
    container_name: plane-redis
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    env_file: .env
    volumes:
      - redisdata:/data
    networks:
      - internal-network

  mq:
    image: rabbitmq:3.13.6-management-alpine
    container_name: plane-mq
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    env_file: .env
    environment:
      <<: *mq-env
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - internal-network

