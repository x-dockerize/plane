volumes:
  redisdata:
#  uploads:
  logs_api:
  logs_worker:
  logs_beat-worker:
  logs_migrator:
  rabbitmq_data:


networks:
  internal-network:
  traefik-network:
    external: true
  postgres-network:
    external: true
